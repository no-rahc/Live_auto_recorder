name: Core operations checks

on:
  pull_request:
    paths:
      - '*.py'
      - 'lar_app/**'
      - 'module/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/core-check.yml'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'lar_app/**'
      - 'module/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/core-check.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate Python sources
        run: python -m compileall -q app_entry.py lar_app module
      - name: Run core unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*_v1.py' -v
          python -m unittest discover -s tests -p 'test_operations_v2.py' -v
          python -m unittest discover -s tests -p 'test_recording_platform_v3.py' -v
