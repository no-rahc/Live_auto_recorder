name: Core operations checks

on:
  pull_request:
    paths:
      - 'app_entry.py'
      - 'module/operations_*.py'
      - 'tests/test_operations_v2.py'
      - 'requirements.txt'
      - '.github/workflows/core-check.yml'
  push:
    branches: [main]
    paths:
      - 'app_entry.py'
      - 'module/operations_*.py'
      - 'tests/test_operations_v2.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python sources
        run: python -m py_compile app_entry.py module/operations_common.py module/operations_health.py module/operations_backup.py module/operations_v2.py
      - name: Run operations unit tests
        run: python -m unittest discover -s tests -p 'test_operations_v2.py' -v
