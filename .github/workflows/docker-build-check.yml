name: Docker multi-platform check

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - 'requirements.txt'
      - 'app_entry.py'
      - 'live_auto_recorder.py'
      - 'templates/**'
      - 'frontend/**'
      - 'tests/**'
      - 'dependent/**'
      - 'scripts/**'
      - 'VERSION'
      - 'lar_app/**'
      - 'module/**'
      - '.github/workflows/docker-build-check.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - 'requirements.txt'
      - 'app_entry.py'
      - 'live_auto_recorder.py'
      - 'templates/**'
      - 'frontend/**'
      - 'tests/**'
      - 'dependent/**'
      - 'scripts/**'
      - 'VERSION'
      - 'lar_app/**'
      - 'module/**'
      - '.github/workflows/docker-build-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: live-auto-recorder:smoke
          cache-from: type=gha

      - name: Smoke test local dashboard and operations
        shell: bash
        run: |
          set -euo pipefail
          container="live-auto-recorder-smoke"
          port=15000

          cleanup() {
            docker logs "$container" 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -p "127.0.0.1:${port}:5000" \
            live-auto-recorder:smoke >/dev/null

          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "Container did not become healthy"
            exit 1
          fi

          status="$(curl -sS -o /tmp/dashboard.html -w '%{http_code}' "http://127.0.0.1:${port}/")"
          if [[ "$status" != "200" ]]; then
            echo "Dashboard returned HTTP ${status}"
            cat /tmp/dashboard.html || true
            exit 1
          fi
          grep -qiE '<!doctype html|<html' /tmp/dashboard.html
          grep -q '녹화 관제 보드' /tmp/dashboard.html
          grep -q '/static/js/console.js' /tmp/dashboard.html
          if grep -qE 'id="root"|/static/library/|/static/v2/' /tmp/dashboard.html; then
            echo "Root dashboard was replaced or received island-only assets"
            exit 1
          fi

          # Default durable-jobs-off image still exposes library reads in v1 chrome.
          for page in broadcasts jobs; do
            curl -fsS "http://127.0.0.1:${port}/${page}" -o "/tmp/${page}.html"
            grep -q 'id="root" class="library-workspace"' "/tmp/${page}.html"
            grep -q '/static/library/library.js' "/tmp/${page}.html"
            grep -q '/static/library/library.css' "/tmp/${page}.html"
            grep -q '/static/js/console.js' "/tmp/${page}.html"
            grep -q '/static/css/console.css' "/tmp/${page}.html"
          done
          curl -fsS "http://127.0.0.1:${port}/static/library/library.js" >/dev/null
          curl -fsS "http://127.0.0.1:${port}/static/library/library.css" >/dev/null
          curl -fsS "http://127.0.0.1:${port}/api/v2/broadcasts?limit=1" >/dev/null
          curl -fsS "http://127.0.0.1:${port}/api/v2/jobs" -o /tmp/jobs.json
          python -c 'import json; result=json.load(open("/tmp/jobs.json")); assert result["available"] is False and result["items"] == []'
          blocked_status="$(curl -sS -o /tmp/jobs-disabled.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: docker-disabled-smoke' \
            --data '{"kind":"verify","target_id":"synthetic","input_revision":1,"options":{}}' \
            "http://127.0.0.1:${port}/api/v2/jobs")"
          test "$blocked_status" = "409"
          curl -sS -D /tmp/legacy-library.headers -o /dev/null "http://127.0.0.1:${port}/v2/broadcasts?query=sample"
          grep -qiE '^location: /broadcasts\?query=sample' /tmp/legacy-library.headers
          for page in channels config recording files; do
            curl -fsS "http://127.0.0.1:${port}/${page}" -o "/tmp/legacy-${page}.html"
            if grep -qE 'id="root"|/static/library/' "/tmp/legacy-${page}.html"; then
              echo "Legacy ${page} page unexpectedly replaced"
              exit 1
            fi
          done
          if grep -q '<h2>로그인</h2>' /tmp/dashboard.html; then
            echo "Dashboard unexpectedly rendered the legacy login form"
            exit 1
          fi

          operations_status="$(curl -sS -o /tmp/operations.html -w '%{http_code}' "http://127.0.0.1:${port}/operations")"
          test "$operations_status" = "200"
          grep -qiE '<!doctype html|<html' /tmp/operations.html

          management_status="$(curl -sS -o /tmp/recordings.json -w '%{http_code}' "http://127.0.0.1:${port}/api/v3/recordings?limit=1")"
          test "$management_status" = "200"

          token_status="$(curl -sS -o /tmp/token-error.json -w '%{http_code}' "http://127.0.0.1:${port}/api/v3/automation/status")"
          test "$token_status" = "401"
          grep -q 'Valid read API token required' /tmp/token-error.json

          login_status="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/login")"
          test "$login_status" = "302"

      - name: Build amd64 and arm64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
