name: Docker multi-platform check

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - 'requirements.txt'
      - 'app_entry.py'
      - 'live_auto_recorder.py'
      - 'templates/**'
      - 'frontend/**'
      - 'tests/**'
      - 'dependent/**'
      - 'scripts/**'
      - 'VERSION'
      - 'lar_app/**'
      - 'module/**'
      - '.github/workflows/docker-build-check.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - 'requirements.txt'
      - 'app_entry.py'
      - 'live_auto_recorder.py'
      - 'templates/**'
      - 'frontend/**'
      - 'tests/**'
      - 'dependent/**'
      - 'scripts/**'
      - 'VERSION'
      - 'lar_app/**'
      - 'module/**'
      - '.github/workflows/docker-build-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: live-auto-recorder:smoke
          cache-from: type=gha

      - name: Smoke test local dashboard and operations
        shell: bash
        run: |
          set -euo pipefail
          container="live-auto-recorder-smoke"
          port=15000

          cleanup() {
            docker logs "$container" 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -p "127.0.0.1:${port}:5000" \
            live-auto-recorder:smoke >/dev/null

          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "Container did not become healthy"
            exit 1
          fi

          # A stock image opens v2 without enabling the durable engine.
          redirect="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1:${port}/")"
          test "$redirect" = "307 http://127.0.0.1:${port}/v2"
          curl -fsSL "http://127.0.0.1:${port}/" -o /tmp/dashboard.html
          grep -q '/static/v2/assets/' /tmp/dashboard.html
          if grep -q 'console.js' /tmp/dashboard.html; then
            echo "v2 unexpectedly contains legacy console assets"
            exit 1
          fi
          for route in channels status settings jobs; do
            curl -fsS "http://127.0.0.1:${port}/api/v2/${route}" -o "/tmp/v2-${route}.json"
          done
          grep -q '"durable_jobs":false' /tmp/v2-status.json
          grep -q '"available":false' /tmp/v2-jobs.json
          # Check the backwards-compatible dashboard independently.
          curl -fsS "http://127.0.0.1:${port}/legacy" -o /tmp/legacy.html
          grep -q '녹화 관제 보드' /tmp/legacy.html
          grep -q 'console.js' /tmp/legacy.html
          if grep -q '<h2>로그인</h2>' /tmp/legacy.html; then
            echo "Dashboard unexpectedly rendered the legacy login form"
            exit 1
          fi

          operations_status="$(curl -sS -o /tmp/operations.html -w '%{http_code}' "http://127.0.0.1:${port}/operations")"
          test "$operations_status" = "200"
          grep -qiE '<!doctype html|<html' /tmp/operations.html

          management_status="$(curl -sS -o /tmp/recordings.json -w '%{http_code}' "http://127.0.0.1:${port}/api/v3/recordings?limit=1")"
          test "$management_status" = "200"

          token_status="$(curl -sS -o /tmp/token-error.json -w '%{http_code}' "http://127.0.0.1:${port}/api/v3/automation/status")"
          test "$token_status" = "401"
          grep -q 'Valid read API token required' /tmp/token-error.json

          login_status="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/login")"
          test "$login_status" = "302"

      - name: Build amd64 and arm64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
