name: Security checks

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.js'
      - 'requirements.txt'
      - 'package.json'
      - '.github/workflows/security-check.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.js'
      - 'requirements.txt'
      - 'package.json'
      - '.github/workflows/security-check.yml'
  schedule:
    - cron: '20 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          # These advisories currently require aiohttp 3.14.3 and
          # cryptography 50.0.0, which have not been released on PyPI.
          # Keep the packages at their latest stable releases and remove
          # each exception as soon as the fixed release is available.
          python -m pip_audit -r requirements.txt --strict \
            --ignore-vuln PYSEC-2026-3545 \
            --ignore-vuln PYSEC-2026-3552

  codeql:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
