name: Security checks

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.js'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-check.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.js'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-check.yml'
  public:
  schedule:
    - cron: '20 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --strict

  history-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.0'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${version}_checksums.txt"
          grep "  ${archive}$" "gitleaks_${version}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          ./gitleaks version
      - name: Scan complete Git history
        run: ./gitleaks git --redact --verbose --exit-code 1

  codeql:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
