name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/live-auto-recorder
    steps:
      - name: Check Docker Hub secrets
        shell: bash
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || (echo "Missing DOCKERHUB_TOKEN" && exit 1)

      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release metadata
        run: python3 scripts/release.py check

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "$version" || (
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $version" && exit 1
          )

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: live-auto-recorder:smoke
          cache-from: type=gha

      - name: Smoke test health and dashboard
        shell: bash
        run: |
          set -euo pipefail
          container="live-auto-recorder-smoke"
          port=15000

          cleanup() {
            docker logs "$container" 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -p "127.0.0.1:${port}:5000" \
            -e ALLOW_ANONYMOUS=true \
            live-auto-recorder:smoke >/dev/null

          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "Container did not become healthy"
            exit 1
          fi

          status="$(curl -sS -o /tmp/dashboard.html -w '%{http_code}' "http://127.0.0.1:${port}/")"
          if [[ "$status" != "200" ]]; then
            echo "Dashboard returned HTTP ${status}"
            cat /tmp/dashboard.html || true
            exit 1
          fi
          grep -qiE '<!doctype html|<html' /tmp/dashboard.html

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
