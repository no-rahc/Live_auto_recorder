name: Release conventions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate release metadata
        run: python scripts/release.py check

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          title = os.environ['PR_TITLE'].strip()
          pattern = re.compile(
              r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)'
              r'(\([a-z0-9._-]+\))?!?: .{3,72}$'
          )
          if not pattern.fullmatch(title):
              raise SystemExit(
                  'PR title must follow Conventional Commits, for example: '
                  'feat(ui): improve recording dashboard'
              )
          print(f'Valid PR title: {title}')
          PY
