name: Cleanup merged branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete completed work branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          owner="${GITHUB_REPOSITORY%%/*}"
          deleted=0
          kept=0

          while IFS= read -r remote_ref; do
            [[ -n "$remote_ref" ]] || continue
            branch="${remote_ref#origin/}"
            safe_to_delete=false

            if [[ "$branch" == dependabot/* ]]; then
              open_pr="$(
                gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                  -f state=open \
                  -f head="${owner}:${branch}" \
                  --jq '.[].number' \
                  | head -n 1
              )"
              if [[ -z "$open_pr" ]]; then
                safe_to_delete=true
              fi
            elif git merge-base --is-ancestor "$remote_ref" origin/main; then
              safe_to_delete=true
            else
              merged_pr="$(
                gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                  -f state=closed \
                  -f head="${owner}:${branch}" \
                  --jq '.[] | select(.merged_at != null) | .number' \
                  | head -n 1
              )"
              if [[ -n "$merged_pr" ]]; then
                safe_to_delete=true
              fi
            fi

            if [[ "$safe_to_delete" == true ]]; then
              encoded="$(python - "$branch" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
              )"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
              echo "Deleted ${branch}"
              deleted=$((deleted + 1))
            else
              echo "Kept active branch: ${branch}"
              kept=$((kept + 1))
            fi
          done < <(
            git for-each-ref --format='%(refname:short)' \
              refs/remotes/origin/agent/ \
              refs/remotes/origin/dependabot/
          )

          echo "Deleted ${deleted} completed branches; kept ${kept} active branches."
