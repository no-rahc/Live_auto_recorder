name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all Python and JavaScript regressions (no skips)
        run: python scripts/test_regressions.py
      - name: Install v2 frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck, unit test, and build v2 UI
        working-directory: frontend
        run: npm test && npm run build
      - name: Install Chromium for UI regressions
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Render fixture-only default v2 previews
        working-directory: frontend
        run: npm run test:browser -- --grep "compatibility preview"
      - name: Save default v2 preview screenshots
        uses: actions/upload-artifact@v7
        with:
          name: v2-default-ui-preview
          path: frontend/test-results/v2-default-*-sample.png
          if-no-files-found: error
          retention-days: 7
      - name: Test desktop, mobile, and interrupted UI flows
        working-directory: frontend
        run: npm run test:browser
