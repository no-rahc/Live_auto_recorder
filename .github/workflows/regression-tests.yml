name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rendered-preview:
    name: Render v1-integrated preview first
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated preview dependencies
        run: |
          python -m pip install Jinja2==3.1.6
          npm --prefix frontend ci --no-audit --no-fund
      - name: Build the embedded library bundle
        working-directory: frontend
        run: npm run build
      - name: Install Chromium and Korean fonts
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual dashboard, library, jobs and detail at desktop and mobile sizes
        working-directory: frontend
        env:
          UI_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:browser -- --grep @preview
      - name: Upload labeled synthetic previews immediately
        if: always()
        id: preview
        uses: actions/upload-artifact@v7
        with:
          name: v1-integrated-synthetic-preview
          path: |
            frontend/test-results/fixture/
            frontend/playwright-report/fixture/
          retention-days: 14
          archive: true
          if-no-files-found: error
      - name: Link preview for review before merge
        if: ${{ always() && steps.preview.outcome == 'success' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          if [[ ! "$PREVIEW_URL" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/[0-9]+$ ]]; then
            echo '::error::Preview artifact URL is missing or malformed'
            exit 1
          fi
          {
            echo '### v1-integrated UI preview'
            echo 'Original Jinja dashboard/console plus embedded Broadcasts and Jobs; no replacement shell.'
            echo 'Screenshots visibly label synthetic sample data. This is a CI rendering, not a deployment or live installation.'
            echo "[Download rendered screenshots and browser report](${PREVIEW_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Note when the preview artifact is unavailable
        if: ${{ always() && steps.preview.outcome != 'success' }}
        run: |
          {
            echo '### v1-integrated UI preview'
            echo 'Preview upload did not succeed; no download link is available.'
          } >> "$GITHUB_STEP_SUMMARY"

  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all Python and JavaScript regressions (no skips)
        run: python scripts/test_regressions.py
      - name: Install embedded frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Unit test, typecheck and build the integrated library
        working-directory: frontend
        run: npm test && npm run build
      - name: Install Chromium for UI regressions
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test integrated desktop, mobile and interrupted flows
        working-directory: frontend
        run: npm run test:browser -- --grep-invert @preview
      - name: Upload interaction failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integrated-ui-interactions
          path: |
            frontend/test-results/fixture/
            frontend/playwright-report/fixture/
          retention-days: 14
          archive: true
          if-no-files-found: warn

  full-app-browser:
    name: Real app browser (durable jobs ${{ matrix.durable }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        durable: ['false', 'true']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install app, media and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          npm --prefix frontend ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd frontend && npx playwright install --with-deps chromium
      - name: Build embedded assets
        working-directory: frontend
        run: npm run build
      - name: Check actual app with disposable synthetic recordings
        working-directory: frontend
        env:
          UI_REAL_APP: '1'
          UI_DURABLE_JOBS: ${{ matrix.durable }}
        run: npm run test:browser
      - name: Upload real-app browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-app-browser-durable-${{ matrix.durable }}
          path: |
            frontend/test-results/real-app/
            frontend/playwright-report/real-app/
          retention-days: 14
          archive: true
          if-no-files-found: warn

  verify-artifact-downloads:
    name: Verify artifact downloads
    needs: [rendered-preview, regressions, full-app-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download all artifacts with Node.js 24
        uses: actions/download-artifact@v8
        with:
          path: artifact-downloads
          digest-mismatch: error
      - name: Verify existing artifact names and report files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('artifact-downloads')
          expected = {
              'v1-integrated-synthetic-preview': 'fixture',
              'integrated-ui-interactions': 'fixture',
              'real-app-browser-durable-false': 'real-app',
              'real-app-browser-durable-true': 'real-app',
          }
          for name, report_folder in expected.items():
              artifact = root / name
              assert artifact.is_dir(), f'Missing artifact: {name}'
              report = artifact / 'playwright-report' / report_folder / 'index.html'
              assert report.is_file() and report.stat().st_size > 0, (
                  f'Missing or empty Playwright report: {name}'
              )

          screenshots = root / 'v1-integrated-synthetic-preview' / 'test-results' / 'fixture'
          for name in ('synthetic-dashboard-mobile.png', 'synthetic-library-desktop.png'):
              assert any(screenshots.rglob(name)), f'Missing preview screenshot: {name}'

          print('All four artifacts downloaded with expected reports and screenshots.')
          PY

  runtime-regressions:
    name: Python 3.15 production-runtime regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install production Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full Python regressions on the deployed Python major version
        run: python scripts/test_regressions.py

  publish-after-tests:
    name: Publish tested main commit
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [verify-artifact-downloads, runtime-regressions]
    uses: ./.github/workflows/docker-publish.yml
    with:
      verified_by_ci: true
    secrets: inherit
