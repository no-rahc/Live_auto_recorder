name: UI layout checks

on:
  pull_request:
    paths:
      - 'app_entry.py'
      - 'lar_app/**/*.py'
      - 'module/config_*.py'
      - 'module/operations_*.py'
      - 'VERSION'
      - 'templates/**'
      - 'tests/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/ui-check.yml'
  push:
    branches: [main]
    paths:
      - 'app_entry.py'
      - 'lar_app/**/*.py'
      - 'module/config_*.py'
      - 'module/operations_*.py'
      - 'VERSION'
      - 'templates/**'
      - 'tests/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate source files
        shell: bash
        run: |
          python3 -m compileall -q app_entry.py lar_app module
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          from lar_app.web.assets import all_asset_paths

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:[.-][0-9A-Za-z.-]+)?', version):
              raise SystemExit(f'invalid VERSION: {version}')

          paths = all_asset_paths()
          if len(paths) != len(set(paths)):
              raise SystemExit('duplicate paths in web asset manifest')

          for public_path in paths:
              source_path = Path('templates') / public_path.lstrip('/')
              if not source_path.is_file():
                  raise SystemExit(f'missing registered asset: {source_path}')
              if source_path.suffix == '.css':
                  css = source_path.read_text(encoding='utf-8')
                  if css.count('{') != css.count('}'):
                      raise SystemExit(f'unbalanced CSS braces: {source_path}')
              elif source_path.suffix == '.js':
                  subprocess.run(['node', '--check', str(source_path)], check=True)
          PY

      - name: Install test dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive UI checks
        run: npm run test:ui

      - name: Upload UI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-layout-report
          path: |
            package-lock.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
