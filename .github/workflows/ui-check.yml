name: UI layout checks

on:
  pull_request:
    paths:
      - 'app_entry.py'
      - 'module/operations_*.py'
      - 'VERSION'
      - 'templates/**'
      - 'tests/ui/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/ui-check.yml'
  push:
    branches: [main]
    paths:
      - 'app_entry.py'
      - 'module/operations_*.py'
      - 'VERSION'
      - 'templates/**'
      - 'tests/ui/**'
      - 'package.json'
      - 'playwright.config.js'

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate source files
        shell: bash
        run: |
          python3 -m py_compile app_entry.py module/operations_common.py module/operations_health.py module/operations_backup.py module/operations_v2.py
          node --check templates/static/js/system-metrics-v2.js
          node --check templates/static/js/sidebar-v3.js
          node --check templates/static/js/dashboard-v4.js
          node --check templates/static/js/dashboard-channel-modal-v1.js
          node --check templates/static/js/app-ui-v3.js
          node --check templates/static/js/config-density-v1.js
          node --check templates/static/js/operations-v2.js
          python3 - <<'PY'
          import re
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:[.-][0-9A-Za-z.-]+)?', version):
              raise SystemExit(f'invalid VERSION: {version}')

          for css_path in (
              'templates/static/css/app-v3.css',
              'templates/static/css/dashboard-glance-v1.css',
              'templates/static/css/dashboard-channel-modal-v1.css',
              'templates/static/css/config-density-v1.css',
              'templates/static/css/recording-density-v1.css',
              'templates/static/css/operations-v2.css',
          ):
              css = Path(css_path).read_text(encoding='utf-8')
              if css.count('{') != css.count('}'):
                  raise SystemExit(f'unbalanced CSS braces: {css_path}')
          PY

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive UI checks
        run: npm run test:ui

      - name: Upload UI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-layout-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
