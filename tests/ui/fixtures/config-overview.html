<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Auto Recorder</title>
  <link rel="stylesheet" href="/templates/static/css/app-v3.css">
  <link rel="stylesheet" href="/templates/static/css/config-workspace-v1.css">
  <link rel="stylesheet" href="/templates/static/css/config-safety-v1.css">
  <link rel="stylesheet" href="/templates/static/css/config-overview-v2.css">
  <style>
    body { margin: 0; }
    #content { margin: 0 auto; }
  </style>
</head>
<body class="page-config">
  <main id="content">
    <h1>설정</h1>
    <form id="configForm" data-has-account="1">
      <section class="config-section">
        <header class="section-head"><span class="section-num">01</span><h3>기본 설정</h3><span class="section-tag">Basic</span></header>
        <label for="autoRecordingMode">자동 녹화</label>
        <select id="autoRecordingMode" name="autoRecordingMode"><option value="true" selected>ON</option><option value="false">OFF</option></select>
        <p class="description">프로그램 시작 시 채널 감시를 자동으로 시작합니다.</p>
        <label for="recheckInterval">방송 재탐색 주기</label>
        <input id="recheckInterval" name="recheckInterval" value="120">
        <label for="filenamePattern">파일명 규칙</label>
        <input id="filenamePattern" name="filenamePattern" value="{recording_time}_{channel_name}_{safe_live_title}">
      </section>

      <section class="config-section">
        <header class="section-head"><span class="section-num">02</span><h3>치지직</h3><span class="section-tag">CHZZK</span></header>
        <label for="plugin_type">플러그인</label>
        <select id="plugin_type" name="plugin_type"><option value="basic" selected>기본</option><option value="timemachine_plus">타임머신 플러스</option></select>
        <label for="timemachine_time_shift">타임머신 시프트</label>
        <input id="timemachine_time_shift" name="timemachine_time_shift" value="0">
      </section>

      <section class="config-section">
        <header class="section-head"><span class="section-num">03</span><h3>후처리</h3><span class="section-tag">Post</span></header>
        <label for="autoPostProcessing">자동 후처리</label>
        <select id="autoPostProcessing" name="autoPostProcessing"><option value="true">ON</option><option value="false" selected>OFF</option></select>
        <label for="deleteAfterPostProcessing">후처리 후 원본 삭제</label>
        <select id="deleteAfterPostProcessing" name="deleteAfterPostProcessing"><option value="true">ON</option><option value="false" selected>OFF</option></select>
        <label for="removeFixedPrefix">고정 접두사 제거</label>
        <select id="removeFixedPrefix" name="removeFixedPrefix"><option value="true">ON</option><option value="false" selected>OFF</option></select>
        <label for="moveAfterProcessingEnabled">후처리 후 파일 이동</label>
        <select id="moveAfterProcessingEnabled" name="moveAfterProcessingEnabled"><option value="true">ON</option><option value="false" selected>OFF</option></select>
        <label for="moveAfterProcessing">이동 경로</label>
        <input id="moveAfterProcessing" name="moveAfterProcessing" value="/recordings/processed">
      </section>

      <section class="config-section">
        <header class="section-head"><span class="section-num">04</span><h3>분할 녹화</h3><span class="section-tag">Split</span></header>
        <label for="splitRecordingMode">분할 녹화</label>
        <select id="splitRecordingMode" name="splitRecordingMode"><option value="true">ON</option><option value="false" selected>OFF</option></select>
        <label for="splitPostProcessing">분할 파일 후처리</label>
        <select id="splitPostProcessing" name="splitPostProcessing"><option value="true" selected>ON</option><option value="false">OFF</option></select>
        <label for="autoStopInterval">분할 시간</label>
        <input id="autoStopInterval" name="autoStopInterval" value="3600">
        <label for="splitOverlapSec">겹침 시간</label>
        <input id="splitOverlapSec" name="splitOverlapSec" value="8">
      </section>

      <section class="config-section">
        <header class="section-head"><span class="section-num">05</span><h3>인코딩</h3><span class="section-tag">Encoding</span></header>
        <label for="stream_copy">원본 유지</label>
        <select id="stream_copy" name="stream_copy"><option value="true" selected>ON</option><option value="false">OFF</option></select>
        <label for="video_codec">비디오 코덱</label>
        <select id="video_codec" name="video_codec"><option value="libx264" selected>H.264 (CPU)</option><option value="libx265">H.265 (CPU)</option></select>
        <label for="preset">프리셋</label>
        <select id="preset" name="preset"><option value="veryfast" selected>veryfast</option><option value="slow">slow</option></select>
        <label for="use_bitrate_mode">비트레이트 모드</label>
        <select id="use_bitrate_mode" name="use_bitrate_mode"><option value="true">ON</option><option value="false" selected>OFF</option></select>
        <label for="video_quality">화질</label>
        <input id="video_quality" name="video_quality" value="23">
        <label for="video_bitrate">비디오 비트레이트</label>
        <input id="video_bitrate" name="video_bitrate" value="5000k">
        <label for="vbv_maxrate">최대 비트레이트</label>
        <input id="vbv_maxrate" name="vbv_maxrate" value="">
        <label for="vbv_bufsize">버퍼 크기</label>
        <input id="vbv_bufsize" name="vbv_bufsize" value="">
        <label for="extra_ffmpeg_options">FFmpeg 추가 옵션</label>
        <input id="extra_ffmpeg_options" name="extra_ffmpeg_options" value="">
        <label for="audio_codec">오디오 코덱</label>
        <select id="audio_codec" name="audio_codec"><option value="aac" selected>AAC</option></select>
        <label for="audio_bitrate">오디오 비트레이트</label>
        <select id="audio_bitrate" name="audio_bitrate"><option value="copy" selected>원본 유지</option><option value="192k">192k</option></select>
      </section>

      <section class="config-section">
        <header class="section-head"><span class="section-num">06</span><h3>Telegram</h3><span class="section-tag">Notification</span></header>
        <label for="telegram_enabled">Telegram 알림</label>
        <select id="telegram_enabled" name="telegram_enabled"><option value="true" selected>ON</option><option value="false">OFF</option></select>
        <label for="telegram_bot_token">봇 토큰</label>
        <input id="telegram_bot_token" name="telegram_bot_token" type="password" value="" data-stored-secret="true">
        <label for="telegram_chat_id">채팅 ID</label>
        <input id="telegram_chat_id" name="telegram_chat_id" type="password" value="" data-stored-secret="true">
        <label for="testTelegramBtn">연결 테스트</label>
        <button id="testTelegramBtn" type="button">테스트 메시지 전송</button>
      </section>

      <section class="config-section">
        <header class="section-head"><span class="section-num">07</span><h3>Discord</h3><span class="section-tag">Notification</span></header>
        <label for="discord_enabled">Discord 알림</label>
        <select id="discord_enabled" name="discord_enabled"><option value="true">ON</option><option value="false" selected>OFF</option></select>
        <label for="discord_webhook_url">웹훅 URL</label>
        <input id="discord_webhook_url" name="discord_webhook_url" type="password" value="" data-stored-secret="false">
        <label for="testDiscordBtn">연결 테스트</label>
        <button id="testDiscordBtn" type="button">테스트 메시지 전송</button>
      </section>

      <section class="config-section">
        <header class="section-head"><span class="section-num">08</span><h3>파일 관리자</h3><span class="section-tag">Files</span></header>
        <label for="fileManagerEnabled">파일 관리자</label>
        <select id="fileManagerEnabled" name="fileManagerEnabled"><option value="true" selected>ON</option><option value="false">OFF</option></select>
        <label for="fileManagerMode">접근 범위</label>
        <select id="fileManagerMode" name="fileManagerMode"><option value="whitelist" selected>화이트리스트</option><option value="blacklist">블랙리스트</option></select>
        <label for="fileManagerReadOnly">읽기 전용</label>
        <select id="fileManagerReadOnly" name="fileManagerReadOnly"><option value="true" selected>ON</option><option value="false">OFF</option></select>
        <label for="trashEnabled">휴지통</label>
        <select id="trashEnabled" name="trashEnabled"><option value="true" selected>ON</option><option value="false">OFF</option></select>
        <div id="fm-roots-section">
          <label>허용 경로</label>
          <div id="fm-roots"><div id="fm-roots-list"><div class="fm-root-row"><input name="fileManagerRoots" value="/recordings"><button class="rm-root" type="button">삭제</button></div></div><button id="add-fm-root" type="button">경로 추가</button></div>
        </div>
      </section>

      <section class="config-section">
        <header class="section-head"><span class="section-num">09</span><h3>로그인</h3><span class="section-tag">Security</span></header>
        <label for="loginMode">로그인 보호</label>
        <select id="loginMode" name="loginMode"><option value="true" selected>ON</option><option value="false">OFF</option></select>
        <input type="submit" value="설정 업데이트">
      </section>
    </form>

    <div id="account-fields">
      <section class="config-section">
        <header class="section-head"><span class="section-num">10</span><h3>계정 정보</h3><span class="section-tag">Account</span></header>
        <p>관리자 계정이 등록되어 있습니다.</p>
      </section>
    </div>
  </main>
  <script src="/templates/static/js/config-workspace-v1.js"></script>
  <script src="/templates/static/js/config-safety-v1.js"></script>
  <script src="/templates/static/js/config-overview-v2.js"></script>
</body>
</html>
